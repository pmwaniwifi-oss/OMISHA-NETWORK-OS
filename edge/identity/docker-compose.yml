services:
  identity-db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: omisha_identity
      POSTGRES_USER: omisha_identity_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/identity_db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - identity_db_password
    volumes:
      - identity_db_data:/var/lib/postgresql
    shm_size: 256mb
    networks:
      - identity_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omisha_identity_admin -d omisha_identity"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  identity_db_data:

networks:
  identity_internal:
    internal: true

secrets:
  identity_db_password:
    file: ./secrets/identity_db_password
