services:
  licensing:
    build: ./licensing
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMISHA_TENANT: ${OMISHA_TENANT:?Set OMISHA_TENANT}
      OMISHA_INSTALLATION: ${OMISHA_INSTALLATION:?Set OMISHA_INSTALLATION}
    volumes:
      - ./runtime:/run/omisha:ro
    ports:
      - "127.0.0.1:9080:9080"
    command: ["serve", "--public-key", "/run/omisha/public.pem", "--license", "/run/omisha/license.json"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

