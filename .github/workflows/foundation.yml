name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r licensing/requirements.txt -r logging/requirements.txt
      - run: python -m unittest discover -s licensing -p 'test_*.py' -v
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python -m unittest discover -s logging -p 'test_*.py' -v
      - run: python -m unittest discover -s reporting -p 'test_*.py' -v
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: edge/gateway/go.mod
          cache: false
      - working-directory: edge/gateway
        run: |
          go vet ./...
          go test -race ./...
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMISHA_TENANT: ci-tenant
      OMISHA_INSTALLATION: ci-installation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          docker compose config --quiet
          docker compose -f edge/docker-compose.yml config --quiet
          docker compose build
          docker compose -f edge/docker-compose.yml build
          docker build -t omisha-reporting-ci reporting
      - name: Reporting tests inside container
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --network none --tmpfs /tmp:rw,noexec,nosuid,size=16m -v "$PWD/reporting:/tests:ro" --entrypoint python omisha-reporting-ci -m unittest discover -s /tests -p 'test_*.py' -v
      - name: Licensing tests inside the pinned image
        run: |
          docker compose -f docker-compose.yml -f .github/compose.test.yml run --rm --no-deps -v "$PWD/licensing:/tests:ro" --entrypoint python licensing -m unittest discover -s /tests -p 'test_*.py' -v
      - name: Edge connectivity smoke test
        run: |
          docker compose -f edge/docker-compose.yml up -d --wait --wait-timeout 90
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/v1/customer)" = 501
          docker compose -f edge/docker-compose.yml stop valkey
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/readyz)" = 503
          curl --fail http://127.0.0.1:8088/healthz
      - name: Cleanup CI containers
        if: always()
        run: docker compose -f edge/docker-compose.yml down --volumes
